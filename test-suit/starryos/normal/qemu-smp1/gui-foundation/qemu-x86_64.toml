args = [
  "-m",
  "512M",
  "-display",
  "none",
  "-serial",
  "mon:stdio",
  "-device",
  "virtio-gpu-pci",
  "-device",
  "virtio-keyboard-pci",
  "-device",
  "virtio-mouse-pci",
  "-device",
  "virtio-blk-pci,drive=disk0",
  "-drive",
  "id=disk0,if=none,format=raw,file=${workspace}/target/rootfs/rootfs-x86_64-alpine.img",
  "-device",
  "virtio-net-pci,netdev=net0",
  "-netdev",
  "user,id=net0",
]
uefi = false
to_bin = false
shell_prefix = "root@starry:"
test_commands = [
  "/usr/bin/fb-demo",
  "/usr/bin/evdev-smoke",
  "/usr/bin/timerfd-smoke",
  "/usr/bin/inotify-smoke",
  "/usr/bin/fd-ipc-smoke",
  "/usr/bin/glib-smoke",
]
success_regex = ["(?m)^STARRY_GROUPED_TESTS_PASSED\\s*$"]
fail_regex = ['(?i)\bpanic(?:ked)?\b', '(?m)^STARRY_GROUPED_TEST_FAILED:', '(?m)^FAIL:']
timeout = 60
